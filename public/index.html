<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور والمرتبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

  <!-- شاشة التحميل الأولى -->
  <div id="loadingScreen" class="screen">
    <p>جاري التحميل...</p>
  </div>

  <!-- شاشة تسجيل الدخول / إنشاء حساب -->
  <div id="authScreen" class="screen" style="display:none;">
    <div class="app-header">
      <h1>🗓️ نظام الحضور والمرتبات</h1>
    </div>

    <div class="tabs">
      <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">تسجيل دخول</button>
      <button id="tabSignup" class="tab-btn" onclick="switchTab('signup')">حساب جديد</button>
    </div>

    <!-- تسجيل دخول -->
    <div id="loginForm" class="form-box">
      <div class="input-box">
        <label>رقم الموبايل</label>
        <input type="tel" id="loginPhone" class="input-field" placeholder="01xxxxxxxxx">
      </div>
      <button class="btn-primary" onclick="doLogin()">دخول</button>
      <p id="loginError" class="error-text"></p>
    </div>

    <!-- حساب جديد -->
    <div id="signupForm" class="form-box" style="display:none;">
      <div class="input-box">
        <label>رقم الموبايل</label>
        <input type="tel" id="signupPhone" class="input-field" placeholder="01xxxxxxxxx">
      </div>
      <div class="input-box">
        <label>نوع الحساب</label>
        <div class="role-pick">
          <button type="button" class="role-pick-btn" id="pickWorker" onclick="pickRole('worker')">👷 عامل</button>
          <button type="button" class="role-pick-btn" id="pickSupervisor" onclick="pickRole('supervisor')">👔 مشرف</button>
        </div>
      </div>
      <button class="btn-primary" onclick="doSignup()">إنشاء الحساب والبدء</button>
      <p id="signupError" class="error-text"></p>
    </div>
  </div>

  <!-- شاشة الاشتراك المطلوب -->
  <div id="paywallScreen" class="screen" style="display:none;">
    <div class="section-card" style="text-align:center;">
      <h2>⏳ انتهت فترة التجربة المجانية</h2>
      <p style="margin-top:10px; color:#9ca3af;">محتاج تشترك عشان تكمل استخدام النظام.</p>
      <p style="margin-top:10px;" id="paywallMessage"></p>
    </div>
  </div>

  <!-- الشاشة الرئيسية بعد الدخول -->
  <div id="mainScreen" class="screen" style="display:none;">
    <div class="top-nav-bar">
      <span id="userRoleDisplay">-</span>
      <button class="btn-switch-role" onclick="logout()">🚪 خروج</button>
    </div>

    <!-- وضع "اليوم فقط" -->
    <div id="todayView" class="section-card">
      <h2 id="todayDateTitle">اليوم</h2>

      <div class="input-box">
        <label>حالة الحضور</label>
        <select id="todayStatus" class="input-field">
          <option value="1">حاضر (1 يوم)</option>
          <option value="0.5">نصف يوم (0.5)</option>
          <option value="0">راحة / غياب (0)</option>
        </select>
      </div>

      <div class="quick-actions">
        <button type="button" class="btn-action presence" id="todayMultBtn" onclick="toggleTodayMult()">2x مضاعف</button>
        <button type="button" class="btn-action absence" id="todayNightBtn" onclick="toggleTodayNight()">سهرة</button>
      </div>

      <button class="btn-save-main" onclick="saveToday()">💾 حفظ بيانات اليوم</button>
      <p id="todaySavedMsg" class="success-text"></p>
    </div>

    <!-- وضع "آخر يوم في الشهر" -->
    <div id="lastDayView" class="section-card" style="display:none;">
      <div class="days-header">
        <div class="days-title">📋 جدول الشهر بالكامل (آخر يوم)</div>
      </div>
      <div class="days-list" id="monthDaysList"></div>

      <div class="input-box" style="margin-top:15px;">
        <label>سُلفة</label>
        <input type="number" id="advanceInput" class="input-field" value="0">
      </div>

      <button class="btn-save-main" onclick="calcSalary()">🧮 احسب مرتبي</button>
      <p id="attemptsRemainingMsg" class="info-text"></p>

      <div id="salaryResultBox" style="display:none;">
        <div class="net-salary-card">
          <div class="net-salary-title">صافي المرتب</div>
          <div class="net-salary-amount" id="resNetSalary">0.00</div>
        </div>
        <div class="summary-list">
          <div class="summary-row"><span>إجمالي الأيام (بعد الضرب)</span><span id="resDays">0</span></div>
          <div class="summary-row"><span>عدد السهرات</span><span id="resNights">0</span></div>
          <div class="summary-row"><span>المرتب قبل الخصومات</span><span id="resGross">0.00</span></div>
          <div class="summary-row danger"><span>التأمينات</span><span id="resIns">0.00</span></div>
          <div class="summary-row danger"><span>الضريبة</span><span id="resTax">0.00</span></div>
          <div class="summary-row danger"><span>السلفة</span><span id="resAdvance">0.00</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="/app.js"></script>
</body>
</html>
